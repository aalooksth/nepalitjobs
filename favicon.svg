<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="8" fill="#0b0d12"/>
  <!-- Nepal flag triangle simplified as crimson+violet square badge -->
  <rect x="4" y="4" width="24" height="24" rx="5" fill="url(#g)"/>
  <!-- NP text -->
  <text x="16" y="22" font-family="'Outfit',system-ui,sans-serif" font-size="11" font-weight="800"
    text-anchor="middle" fill="white" letter-spacing="-0.5">NP</text>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8264a"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
</svg>
